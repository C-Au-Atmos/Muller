[package]
name = "muller-diff"
version = "0.1.0"
description = "Read-only bounded comparison engine for Muller"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
chardetng = "0.1"
encoding_rs = "0.8"
muller-core = { path = "../muller-core", default-features = false }
serde = { version = "1", features = ["derive"] }
similar = { version = "2.7", features = ["inline"] }
thiserror = "2"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.20"
