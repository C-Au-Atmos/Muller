  <defs>
    <linearGradient id="tile1" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#27272a"/><stop offset="1" stop-color="#18181b"/></linearGradient>
    <linearGradient id="tile2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#202023"/><stop offset="1" stop-color="#121215"/></linearGradient>
    <linearGradient id="tile3" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#303035"/><stop offset="1" stop-color="#1b1b1f"/></linearGradient>
    <filter id="whiteGlow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .ui{font-family:Inter,'Muller UI','Segoe UI',sans-serif;fill:#fafafa}.mono{font-family:'Muller Mono',Consolas,monospace}.muted{fill:#a1a1aa}.dim{fill:#66666e}.tiny{font-size:12px}.small{font-size:14px}.body{font-size:17px}.head{font-size:22px;font-weight:600}.metric{font-size:28px;font-weight:600}.hair{stroke:#2f2f35;stroke-width:1}.seam{stroke:rgba(255,255,255,.45);stroke-width:1.3;fill:none}.focus{stroke:#fff;stroke-width:2.4;fill:none;filter:url(#whiteGlow)}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#09090b"/>
