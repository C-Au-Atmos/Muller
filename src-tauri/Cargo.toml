[package]
name = "muller"
version = "0.1.0"
description = "Windows file intelligence for duplicate discovery and comparison"
authors = ["Muller contributors"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "muller_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "webp"] }
kamadak-exif = "0.6.1"
lofty = "0.24.0"
muller-core = { path = "../crates/muller-core", default-features = false }
muller-diff = { path = "../crates/muller-diff" }
muller-mutate = { path = "../crates/muller-mutate" }
pinyin = { version = "0.10", default-features = false, features = ["plain"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-drag = "2.1.1"
zip = { version = "4.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.20"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_UI_Shell",
] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_NetManagement",
  "Win32_Storage_FileSystem",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
