name: Publish Windows prerelease

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> .cargo-target
      - run: npm ci
      - name: Verify release versions match tag
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          $cargoPackages = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $cargoVersion = ($cargoPackages.packages | Where-Object name -eq "muller").version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version

          if ($packageVersion -ne $cargoVersion -or $packageVersion -ne $tauriVersion) {
            throw "Release versions differ: package=$packageVersion cargo=$cargoVersion tauri=$tauriVersion"
          }
          if ($env:GITHUB_REF_NAME -ne "v$packageVersion") {
            throw "Tag $env:GITHUB_REF_NAME does not match release version $packageVersion"
          }
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Muller ${{ github.ref_name }}"
          releaseBody: |
            Muller ${{ github.ref_name }} is a public Windows preview.

            **Downloads**
            - `*-setup.exe` - recommended Windows installer
            - `*-portable.exe` - standalone portable executable
            - `SHA256SUMS.txt` - SHA-256 checksums for both executables

            This preview is unsigned, so Windows SmartScreen may show an unknown-publisher warning. See [CHANGELOG.md](https://github.com/AuAtmos/Muller/blob/${{ github.ref_name }}/CHANGELOG.md) and the [documentation index](https://github.com/AuAtmos/Muller/blob/${{ github.ref_name }}/docs/README.md) for features and known limits.
          releaseDraft: true
          prerelease: true
          args: --bundles nsis
      - name: Upload portable executable and checksums
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $portable = "Muller_${version}_x64-portable.exe"
          Copy-Item -LiteralPath ".cargo-target/release/muller.exe" -Destination $portable

          $setups = @(Get-ChildItem -LiteralPath ".cargo-target/release/bundle/nsis" -Filter "*setup.exe")
          if ($setups.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($setups.Count)"
          }

          $checksums = @(
            "$((Get-FileHash -LiteralPath $setups[0].FullName -Algorithm SHA256).Hash) *$($setups[0].Name)"
            "$((Get-FileHash -LiteralPath $portable -Algorithm SHA256).Hash) *$portable"
          )
          $checksums | Set-Content -LiteralPath "SHA256SUMS.txt" -Encoding ascii

          gh release upload "${{ github.ref_name }}" $portable "SHA256SUMS.txt" --clobber
      - name: Publish prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ github.ref_name }}" --draft=false --prerelease
