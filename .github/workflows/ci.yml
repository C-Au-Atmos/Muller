name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-quality:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@1.89
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> .cargo-target
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: cargo fmt --all -- --check
      - name: Run Rust workspace tests
        shell: pwsh
        run: |
          $output = @(cargo test --workspace --locked 2>&1)
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Output $_ }
          if ($exitCode -ne 0) {
            $tail = (($output | Select-Object -Last 30) -join " | ").Replace("%", "%25")
            Write-Output "::error title=Rust workspace tests failed::$tail"
            exit $exitCode
          }
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: npx playwright install msedge
      - name: Run Playwright E2E
        shell: pwsh
        run: |
          $env:FORCE_COLOR = "0"
          npm run test:e2e 2>&1 | Tee-Object -Variable output
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            $tail = (($output | Select-Object -Last 60) -join " | ").Replace("%", "%25")
            Write-Output "::error title=Playwright E2E failed::$tail"
            exit $exitCode
          }
      - name: Upload E2E failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
